# [SUA NGAY 2026-08-11 - co ho tro cua AI] Doi tu Google GenAI sang OpenAI.
#
# Gia tri gia de thoa man auto-configuration cua OpenAI khi chay test.
# Provider khong he duoc goi trong `contextLoads`, nhung bean connection van duoc dung
# luc khoi dong context nen bat buoc phai co api-key, neu khong test se fail.
#
# Truoc day dong nay la: spring.ai.google.genai.embedding.api-key=test
spring.ai.openai.api-key=test

# The production migration uses SQL Server system catalogs and is applied
# against SQL Server when the application starts.
spring.flyway.enabled=false
