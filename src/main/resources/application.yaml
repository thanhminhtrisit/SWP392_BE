server:
  port: 8080

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  ai:
    # [SUA NGAY 2026-08-11 - co ho tro cua AI] Doi Gemini -> OpenAI.
    # Day la gia tri du phong khi client goi API chat ma khong chi dinh model/temperature.
    # Doc boi AiGenerationOptionsService.
    default-model: ${OPENAI_CHAT_MODEL:gpt-5.6-luna}
    default-temperature: ${OPENAI_CHAT_TEMPERATURE:0.2}
  upload:
    max-video-file-size: ${APP_MAX_VIDEO_FILE_SIZE:52428800}
    max-avatar-file-size: ${APP_MAX_AVATAR_FILE_SIZE:5242880}
  jwt:
    secret: ${APP_JWT_SECRET:}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:300000}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}

spring:
  application:
    name: AI-HUB-STUDY
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: ${APP_MAX_MULTIPART_FILE_SIZE:50MB}
      max-request-size: ${APP_MAX_MULTIPART_REQUEST_SIZE:50MB}
  # =====================================================================================
  # [SUA NGAY 2026-08-11 - co ho tro cua AI] Chuyen nha cung cap AI: Google Gemini -> OpenAI
  #
  # LUU Y QUAN TRONG VE CAU TRUC: Google va OpenAI dung hai dang thuoc tinh KHAC NHAU
  # de bat/tat embedding:
  #     Google GenAI : spring.ai.model.embedding.text = google-genai   (embedding la MAP)
  #     OpenAI       : spring.ai.model.embedding      = openai         (embedding la GIA TRI DON)
  # Vi vay khong the sua gia tri - phai viet lai ca khoi. Mot node YAML khong the vua la
  # chuoi vua la map.
  #
  # Bien moi truong doi theo:  SPRING_AI_MODEL_EMBEDDING_TEXT -> SPRING_AI_MODEL_EMBEDDING
  #
  # Ca chat lan embedding dung CHUNG mot spring.ai.openai.api-key. Neu can tinh tien vao
  # hai tai khoan khac nhau thi co the ghi de rieng bang spring.ai.openai.chat.api-key
  # va spring.ai.openai.embedding.api-key - hien khong dung toi.
  # =====================================================================================
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-5.6-luna}
          # [SUA NGAY 2026-08-11 - co ho tro cua AI] DA XOA dong:
          #     temperature: ${OPENAI_CHAT_TEMPERATURE:0.2}
          #
          # LY DO: co HAI noi co the gui temperature len OpenAI, phai bo CA HAI.
          #   1. Runtime options trong AiChatClientServiceImpl  -> da bo truoc do
          #   2. DEFAULT options o day                          -> chinh la cho nay
          #
          # Spring AI TRON default options voi runtime options. Bo o runtime khong
          # xoa duoc default - gia tri 0.2 nay van di kem moi request va OpenAI van
          # tu choi:
          #   com.openai.errors.BadRequestException: 400: Unsupported value:
          #   'temperature' does not support 0.2 with this model.
          #
          # Dong GPT-5.6 chi chap nhan gia tri mac dinh (1). Khong khai temperature
          # o day thi Spring AI khong gui truong nay len, OpenAI dung mac dinh cua no.
          #
          # LUU Y: app.ai.default-temperature (dong 11) VAN GIU. Do la gia tri o tang
          # ung dung - dung de validate 0.0-1.0, luu vao chat_session.temperature va
          # tra ve trong response. No KHONG BAO GIO duoc gui len OpenAI.
      embedding:
        options:
          # text-embedding-3-small = 1536 chieu. KHONG doi model nay sau khi da index
          # tai lieu: vector khac so chieu se bi VectorSearchServiceImpl bo qua am tham
          # (dong 98, tra ve null) khien AI luon tra loi "khong tim thay thong tin".
          # Muon doi thi phai xoa sach bang document_chunk va index lai toan bo.
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  datasource:
    url: ${SQLSERVER_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=lms_ai;encrypt=true;trustServerCertificate=true}
    username: ${SQLSERVER_DATASOURCE_USERNAME:sa}
    password: ${SQLSERVER_DATASOURCE_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope:
              - email
              - profile

# =====================================================================================
# [SUA NGAY 2026-08-11 - co ho tro cua AI] Thay khoi `aws:` bang khoi `azure:`
#
# LY DO CHUYEN: phan luu tru file chua bao gio chay duoc voi AWS - moi bien AWS_* deu
# rong nen bean S3 khong duoc tao va moi API upload deu loi. Nhom da co san storage
# account Azure that (aistudyhubstorage / container documents / region eastasia).
#
# MOT DIEM KY THUAT DANG LUU: AWS SDK doc AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# THANG TU BIEN MOI TRUONG HE DIEU HANH, khong di qua file nay. Ma springboot4-dotenv
# chi nap .env vao Environment cua Spring chu KHONG doi System.getenv(), nen credential
# AWS trong .env vinh vien khong den duoc SDK. Azure thi connection string di qua
# @ConfigurationProperties binh thuong nen .env nap duoc - day la mot ly do nua de doi.
#
# Bean storage chi duoc tao khi CA connection-string LAN container-name deu co gia tri
# (xem AzureStorageConfig). Thieu cau hinh thi app van khoi dong, chi rieng API file bao loi.
# =====================================================================================
azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    container-name: ${AZURE_STORAGE_CONTAINER:}
    key-prefix: ${AZURE_STORAGE_KEY_PREFIX:}
    sas-expiration-minutes: ${AZURE_STORAGE_SAS_EXPIRATION_MINUTES:10}

google:
  speech:
    project-id: ${GOOGLE_CLOUD_PROJECT_ID:}
    gcs-bucket-name: ${GOOGLE_SPEECH_GCS_BUCKET:}
    gcs-key-prefix: ${GOOGLE_SPEECH_GCS_KEY_PREFIX:transcribe-temp/}
    timeout-seconds: ${GOOGLE_SPEECH_TIMEOUT_SECONDS:300}

rag:
  user-storage:
    allow-general-knowledge: false

ocr:
  tesseract:
    enabled: ${TESSERACT_ENABLED:false}
    executable-path: ${TESSERACT_EXECUTABLE_PATH:}
    tessdata-path: ${TESSERACT_TESSDATA_PATH:}
    language: ${TESSERACT_LANGUAGE:eng}
    timeout-seconds: ${TESSERACT_TIMEOUT_SECONDS:60}
    pdf-dpi: ${TESSERACT_PDF_DPI:200}
    pdf-text-min-characters: ${TESSERACT_PDF_TEXT_MIN_CHARACTERS:20}

docling:
  enabled: ${DOCLING_ENABLED:false}
  base-url: ${DOCLING_BASE_URL:http://localhost:5001}
  api-key: ${DOCLING_API_KEY:}
  timeout-seconds: ${DOCLING_TIMEOUT_SECONDS:300}
  max-tokens: ${DOCLING_MAX_TOKENS:300}
  use-markdown-tables: ${DOCLING_USE_MARKDOWN_TABLES:true}
  merge-peers: ${DOCLING_MERGE_PEERS:true}
  fallback-enabled: ${DOCLING_FALLBACK_ENABLED:true}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:}
